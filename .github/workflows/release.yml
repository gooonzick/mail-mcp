name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing exchanges this OIDC token instead of using an npm token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # bundles npm 11.5.1+, the minimum for trusted publishing
          registry-url: https://registry.npmjs.org
          # No dependency cache in a job that can publish: a poisoned cache would run next to the OIDC token.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Check that the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $expected"
            exit 1
          fi
      # prepublishOnly runs the typecheck and tests, prepack builds dist/.
      - run: npm publish

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
